name: Upload internal TestFlight build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: iOS
        run: xcodegen generate
      - name: Archive and upload to TestFlight
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${ASC_KEY_BASE64:?Missing ASC_KEY_BASE64}"
          : "${ASC_KEY_ID:?Missing ASC_KEY_ID}"
          : "${ASC_ISSUER_ID:?Missing ASC_ISSUER_ID}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID}"
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_BASE64" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          python3 - <<'PY'
          import os, plistlib
          options = {
              "method": "app-store-connect",
              "destination": "upload",
              "signingStyle": "automatic",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "testFlightInternalTestingOnly": True,
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist"), "wb") as f:
              plistlib.dump(options, f)
          PY
          xcodebuild -project iOS/AirWatch.xcodeproj -scheme AirWatch \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AirWatch.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" archive
          python3 - <<'PY_PLIST_CHECK'
          import os, plistlib
          from pathlib import Path
          archive = Path(os.environ["RUNNER_TEMP"]) / "AirWatch.xcarchive/Products/Applications/AirWatch.app"
          with (archive / "Info.plist").open("rb") as f:
              app = plistlib.load(f)
          with (archive / "PlugIns/AirWatchWidget.appex/Info.plist").open("rb") as f:
              widget = plistlib.load(f)
          expected = {"UIInterfaceOrientationPortrait", "UIInterfaceOrientationPortraitUpsideDown",
                      "UIInterfaceOrientationLandscapeLeft", "UIInterfaceOrientationLandscapeRight"}
          assert "UILaunchScreen" in app, "Archived app lacks UILaunchScreen"
          assert expected.issubset(set(app.get("UISupportedInterfaceOrientations", []))), "Archived app lacks orientations"
          assert widget.get("NSExtension", {}).get("NSExtensionPointIdentifier") == "com.apple.widgetkit-extension", "Archived widget lacks extension point"
          print("Archived app and widget Info.plist metadata verified")
          PY_PLIST_CHECK
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AirWatch.xcarchive" \
            -exportPath "$RUNNER_TEMP/AirWatch-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
