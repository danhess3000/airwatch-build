name: Upload internal TestFlight build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Identify build revision
        run: |
          set -euo pipefail
          printf 'Checked-out commit: %s\n' "$(git rev-parse HEAD)"
          printf 'Workflow commit: %s; ref: %s; run: %s; attempt: %s\n' "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Test spoken alert validation
        run: |
          python3 -m unittest discover -s Pi -p 'test_*.py' -v
          swiftc iOS/AirWatch/VoiceSupport/SpokenAlertAudio.swift iOS/Tests/main.swift -o "$RUNNER_TEMP/speech-tests"
          "$RUNNER_TEMP/speech-tests"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: iOS
        run: |
          set -euo pipefail
          xcodegen generate
          plutil -lint AirWatch/App/Info.plist AirWatch/Widget/Info.plist AirWatch/NotificationService/Info.plist
      - name: Archive and upload to TestFlight
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${ASC_KEY_BASE64:?Missing ASC_KEY_BASE64}"
          : "${ASC_KEY_ID:?Missing ASC_KEY_ID}"
          : "${ASC_ISSUER_ID:?Missing ASC_ISSUER_ID}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID}"
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_BASE64" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          python3 - <<'PY'
          import os, plistlib
          options = {
              "method": "app-store-connect",
              "destination": "upload",
              "signingStyle": "automatic",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "testFlightInternalTestingOnly": True,
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist"), "wb") as f:
              plistlib.dump(options, f)
          PY
          xcodebuild -project iOS/AirWatch.xcodeproj -scheme AirWatch \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AirWatch.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" archive
          python3 - <<'PY_PLIST_CHECK'
          import os, plistlib
          from pathlib import Path
          archive = Path(os.environ["RUNNER_TEMP"]) / "AirWatch.xcarchive/Products/Applications/AirWatch.app"
          with (archive / "Info.plist").open("rb") as f:
              app = plistlib.load(f)
          with (archive / "PlugIns/AirWatchWidget.appex/Info.plist").open("rb") as f:
              widget = plistlib.load(f)
          expected = {"UIInterfaceOrientationPortrait", "UIInterfaceOrientationPortraitUpsideDown",
                      "UIInterfaceOrientationLandscapeLeft", "UIInterfaceOrientationLandscapeRight"}
          def require(condition, message):
              if not condition:
                  raise SystemExit(message)
          require(isinstance(app.get("UILaunchScreen"), dict), "Archived app lacks UILaunchScreen dictionary")
          orientations = app.get("UISupportedInterfaceOrientations", [])
          require(isinstance(orientations, list) and expected.issubset(orientations),
                  "Archived app lacks all four supported orientations")
          extension = widget.get("NSExtension", {})
          require(isinstance(extension, dict) and
                  extension.get("NSExtensionPointIdentifier") == "com.apple.widgetkit-extension",
                  "Archived widget lacks NSExtension:NSExtensionPointIdentifier")
          require(app.get("CFBundleIdentifier") == "com.danhess.airwatch", "Unexpected archived app bundle ID")
          require(widget.get("CFBundleIdentifier") == "com.danhess.airwatch.widget", "Unexpected archived widget bundle ID")
          for label, metadata in (("app", app), ("widget", widget)):
              display_name = metadata.get("CFBundleDisplayName")
              require(isinstance(display_name, str) and bool(display_name.strip()),
                      f"Archived {label} lacks CFBundleDisplayName")
          print("Archived app and widget Info.plist metadata verified")
          speech_bundle = archive / "PlugIns/AirWatchNotificationService.appex"
          with (speech_bundle / "Info.plist").open("rb") as f:
              speech = plistlib.load(f)
          require(speech.get("CFBundleIdentifier") == "com.danhess.airwatch.speech", "Wrong speech bundle ID")
          require(speech.get("CFBundleDisplayName") == "AirWatch Speech", "Speech display name missing")
          extension = speech.get("NSExtension", {})
          require(extension.get("NSExtensionPointIdentifier") == "com.apple.usernotifications.service",
                  "Speech service extension point missing")
          require(extension.get("NSExtensionPrincipalClass", "").endswith(".NotificationService"),
                  "Speech extension principal class missing")
          import subprocess
          for bundle in (archive, speech_bundle):
              result = subprocess.run(["codesign", "-d", "--entitlements", ":-", str(bundle)],
                                      capture_output=True, check=True)
              entitlements = plistlib.loads(result.stdout)
              require("group.com.danhess.airwatch" in entitlements.get("com.apple.security.application-groups", []),
                      "Signed bundle lacks speech App Group: " + bundle.name)
              if bundle == archive:
                  # Automatic signing may archive with a development profile.
                  # App Store Connect export re-signs for production distribution.
                  environment = entitlements.get("aps-environment")
                  require(environment in ("development", "production"), "Archived app lacks APNs entitlement")
                  print("Archive APNs environment:", environment, "(before distribution export)")
          print("Archived speech extension and signed App Group entitlements verified")
          PY_PLIST_CHECK
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AirWatch.xcarchive" \
            -exportPath "$RUNNER_TEMP/AirWatch-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
