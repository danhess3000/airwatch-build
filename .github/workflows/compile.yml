name: Compile AirWatch iOS
on:
  workflow_dispatch:
  push:
    paths:
      - 'iOS/**'
      - 'Pi/**'
      - '.github/workflows/compile.yml'
jobs:
  simulator-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test spoken alert validation
        run: |
          python3 -m unittest discover -s Pi -p 'test_*.py' -v
          swiftc iOS/AirWatch/VoiceSupport/SpokenAlertAudio.swift iOS/Tests/main.swift -o "$RUNNER_TEMP/speech-tests"
          "$RUNNER_TEMP/speech-tests"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: iOS
        run: xcodegen generate
      - name: Build for iPhone simulator
        working-directory: iOS
        run: |
          xcodebuild -project AirWatch.xcodeproj -scheme AirWatch \
            -configuration Debug -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO build

