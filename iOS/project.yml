name: AirWatch
options:
  bundleIdPrefix: com.danhess
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  AirWatch:
    type: application
    platform: iOS
    sources:
    - AirWatch/App
    - AirWatch/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danhess.airwatch
        INFOPLIST_FILE: AirWatch/App/Info.plist
        GENERATE_INFOPLIST_FILE: 'NO'
        CODE_SIGN_ENTITLEMENTS: AirWatch/App/AirWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: AirWatch/App/AirWatchRelease.entitlements
    attributes:
      SystemCapabilities:
        com.apple.Push:
          enabled: 1
    dependencies:
    - target: AirWatchWidget
    - target: AirWatchNotificationService
    # XcodeGen rewrites this plist; keep required metadata in properties below.
    info:
      path: AirWatch/App/Info.plist
      properties:
        CFBundleDisplayName: AirWatch
        CFBundleShortVersionString: '0.1'
        CFBundleVersion: '1'
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationPortraitUpsideDown
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: AirWatch reads aircraft and receiver alerts
          from your Raspberry Pi.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSSupportsLiveActivities: true
  AirWatchWidget:
    type: app-extension
    platform: iOS
    sources:
    - AirWatch/Widget
    - AirWatch/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danhess.airwatch.widget
        INFOPLIST_FILE: AirWatch/Widget/Info.plist
        GENERATE_INFOPLIST_FILE: 'NO'
    # XcodeGen rewrites this plist; keep required metadata in properties below.
    info:
      path: AirWatch/Widget/Info.plist
      properties:
        CFBundleDisplayName: AirWatch
        CFBundleShortVersionString: '0.1'
        CFBundleVersion: '1'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  AirWatchNotificationService:
    type: app-extension
    platform: iOS
    sources:
    - AirWatch/NotificationService
    - AirWatch/VoiceSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danhess.airwatch.speech
        GENERATE_INFOPLIST_FILE: 'NO'
        CODE_SIGN_ENTITLEMENTS: AirWatch/NotificationService/NotificationService.entitlements
        APPLICATION_EXTENSION_API_ONLY: 'YES'
    info:
      path: AirWatch/NotificationService/Info.plist
      properties:
        CFBundleDisplayName: AirWatch Speech
        CFBundleShortVersionString: '0.1'
        CFBundleVersion: '1'
        NSLocalNetworkUsageDescription: AirWatch downloads spoken alerts from your Raspberry Pi.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
